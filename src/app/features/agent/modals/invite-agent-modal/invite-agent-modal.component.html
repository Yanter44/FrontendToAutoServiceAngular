<section id="InviteAgentModal" class="InviteAgentSection" [class.Active]="isOpen()">
  <div class="InviteAgentOverlay" (click)="close()"></div>

  <div class="InviteAgentCard">
    <div class="InviteAgentHeader">
      <div class="InviteAgentTitle">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        <h2>Пригласить агента</h2>
      </div>
      @if (branchName()) {
        <p class="InviteAgentSubtitle">В ветку «{{ branchName() }}»</p>
      }
      <button type="button" class="InviteAgentClose" aria-label="Закрыть" (click)="close()">×</button>
    </div>

    <div class="InviteAgentContent">
      <label class="InviteAgentLabel" for="InviteAgentEmailInput">Email агента</label>
      <input
        id="InviteAgentEmailInput"
        type="email"
        class="InviteAgentInput"
        placeholder="agent@example.com"
        [(ngModel)]="email"
        [disabled]="submitting"
        (keydown.enter)="submit()"
      />
      <p class="InviteAgentHint">
        На этот адрес будет отправлено письмо со ссылкой для регистрации.
      </p>
    </div>

    <div class="InviteAgentFooter">
      <button type="button" class="InviteAgentCancel"
              (click)="close()" [disabled]="submitting">
        Отмена
      </button>
      <button type="button" class="InviteAgentSubmit"
              (click)="submit()" [disabled]="submitting">
        @if (submitting) { Отправка... } @else { Пригласить }
      </button>
    </div>
  </div>
</section>
