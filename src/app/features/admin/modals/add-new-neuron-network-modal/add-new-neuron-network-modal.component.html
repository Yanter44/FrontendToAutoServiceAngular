<section id="AddNewNeuronNetworkModal" class="AddNewNeuronNetworkSection" [class.Active]="isOpen()">
  <div class="AddNewNeuronNetworkModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="AddNewNeuronNetworkCard">
    <div class="AddNewNeuronNetworkHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M20 9h2M20 15h2M2 9h2M2 15h2"/></svg>
      <h2>Добавить нейронную сеть</h2>
    </div>
    <div class="AddNewNeuronNetworkContent">
      <div class="AddNewNeuronNetworkFieldsGroup">
        <div class="AddNewNeuronNetworkField">
          <label>Название нейросети</label>
          <input type="text" id="NeuronNetworkNameInput" class="AddNewNeuronNetworkInput" [(ngModel)]="neuronName">
        </div>
        <div class="AddNewNeuronNetworkField">
          <label>Ссылка</label>
          <input type="text" id="NeuronNetworkLinkInput" class="AddNewNeuronNetworkInput" [(ngModel)]="neuronLink">
        </div>
      </div>
    </div>
    <div class="AddNewNeuronNetworkFooter">
      <button class="AddNewNeuronNetworkSubmitButton" type="button" (click)="submitNewNeuronNetwork()">Подтвердить</button>
    </div>
  </div>
</section>
