<section id="DeleteUserModal" class="DeleteUserModalSection" [class.Active]="isOpen()">
  <div class="DeleteUserModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="DeleteUserModalCard">
    <div class="DeleteUserModalHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <h2>Удалить пользователя</h2>
    </div>
    <div class="DeleteUserModalContent">
      <span class="DeleteUserModalWarningContentSpan">Вы действительно хотите удалить пользователя "{{ selectedUserName() }}"?</span>
      <div class="DeleteUserModalFooter">
        <button class="BtnSubmitDeleteUser" type="button" (click)="submitDeleteUser()">Удалить</button>
      </div>
    </div>
  </div>
</section>
