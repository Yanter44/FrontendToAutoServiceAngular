<section id="DeductBalanceModal" class="DeductBalanceSection" [class.Active]="isOpen()">
  <div class="DeductBalanceOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="DeductBalanceCard">
    <div class="DeductBalanceHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <h2>Вычесть баланс</h2>
    </div>
    <div class="DeductBalanceContent">
      <div class="DeductBalanceFieldsGroup">
        <div class="DeductBalanceField">
          <label>Агент</label>
          <select class="DeductBalanceSelect" [(ngModel)]="debitAgentId">
            @for (agent of agents(); track agent.id) {
              <option [ngValue]="agent.id">{{ agent.fio }}</option>
            }
          </select>
        </div>
      </div>
      <div class="DeductBalanceFieldsGroup">
        <div class="CurrentBalanceBlock">
          <span class="DeductModalCurrentBalanceLabel">Текущий баланс</span>
          <span class="DeductModalCurrentAgentBalanceValue">{{ debitBalanceText() }}</span>
        </div>
      </div>
      <div class="DeductBalanceFieldsGroup">
        <div class="DeductBalanceField">
          <label>Сумма вычета</label>
          <input type="number" id="DeductBalanceCashInput" class="DeductBalanceInput" placeholder="Введите сумму" min="1" [(ngModel)]="debitAmount">
        </div>
        <div class="DeductModalQuickAmountButtons">
          <button class="DeductModalQuickAmountButton" [class.Active]="debitQuick === 1000" data-value="1000" type="button" (click)="setDebitQuick(1000)">+1 000 ₽</button>
          <button class="DeductModalQuickAmountButton" [class.Active]="debitQuick === 5000" data-value="5000" type="button" (click)="setDebitQuick(5000)">+5 000 ₽</button>
          <button class="DeductModalQuickAmountButton" [class.Active]="debitQuick === 10000" data-value="10000" type="button" (click)="setDebitQuick(10000)">+10 000 ₽</button>
        </div>
      </div>
      <div class="DeductBalanceFieldsGroup">
        <div class="DeductBalanceField">
          <label>Комментарий</label>
          <input id="DeductBalanceCommentInput" class="DeductBalanceInput" placeholder="Комментарий" [(ngModel)]="debitComment">
        </div>
      </div>
      <div class="DeductBalanceFooter">
        <button class="DeductBalanceSubmitButton" type="button" (click)="submitDebit()">Вычесть</button>
      </div>
    </div>
  </div>
</section>
