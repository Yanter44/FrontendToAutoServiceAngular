<section id="InviteNewUserModal" class="InviteNewUserModalSection" [class.Active]="isOpen()">
  <div class="InviteNewUserModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="InviteNewUserModalCard">
    <div class="InviteNewUserModalHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      <h2>Пригласить пользователя</h2>
    </div>
    <div class="InviteNewUserModalContent">
      <div class="InviteNewUserModalField">
        <label>Должность</label>
        <select class="InviteNewUserModalSelect" [(ngModel)]="inviteRole">
          <option value="agent">Агент</option>
          <option value="admin">Администратор</option>
          <option value="moderator">Модератор</option>
        </select>
      </div>
      <div class="InviteNewUserModalField">
        <label>Email</label>
        <input type="text" id="InviteNewUserEmailInput" class="InviteNewUserModalInput" [(ngModel)]="inviteEmail">
      </div>
    </div>
    <div class="InviteNewUserModalFooter">
      <button type="button" id="InviteNewUserSubmitBtn" class="InviteNewUserSubmitButton" (click)="submitInvite()">Пригласить</button>
    </div>
  </div>
</section>
