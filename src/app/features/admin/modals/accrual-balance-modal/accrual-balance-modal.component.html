<section id="AccrualBalanceModal" class="AccrualBalanceSection" [class.Active]="isOpen()">
  <div class="AccrualBalanceOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="AccrualBalanceCard">
    <div class="AccrualBalanceHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <h2>Начислить баланс</h2>
    </div>
    <div class="AccrualBalanceContent">
      <div class="AccrualBalanceFieldsGroup">
        <div class="AccrualBalanceField">
          <label>Агент</label>
          <select class="AccrualBalanceSelect" [(ngModel)]="creditAgentId">
            @for (agent of agents(); track agent.id) {
              <option [ngValue]="agent.id">{{ agent.fio }}</option>
            }
          </select>
        </div>
      </div>
      <div class="AccrualBalanceFieldsGroup">
        <div class="CurrentBalanceBlock">
          <span class="CurrentBalanceLabel">Текущий баланс</span>
          <span class="AccrualModalCurrentAgentBalanceValue">{{ creditBalanceText() }}</span>
        </div>
      </div>
      <div class="AccrualBalanceFieldsGroup">
        <div class="AccrualBalanceField">
          <label>Сумма начисления</label>
          <input type="number" id="AccrualBalanceCashInput" class="AccrualBalanceInput" placeholder="Введите сумму" min="1" [(ngModel)]="creditAmount">
        </div>
        <div class="QuickAmountButtons">
          <button class="QuickAmountButton" [class.Active]="creditQuick === 1000" data-value="1000" type="button" (click)="setCreditQuick(1000)">+1 000 ₽</button>
          <button class="QuickAmountButton" [class.Active]="creditQuick === 5000" data-value="5000" type="button" (click)="setCreditQuick(5000)">+5 000 ₽</button>
          <button class="QuickAmountButton" [class.Active]="creditQuick === 10000" data-value="10000" type="button" (click)="setCreditQuick(10000)">+10 000 ₽</button>
        </div>
      </div>
      <div class="AccrualBalanceFieldsGroup">
        <div class="AccrualBalanceField">
          <label>Комментарий</label>
          <input id="AccrualBalanceCommentInput" class="AccrualBalanceInput" placeholder="Комментарий" [(ngModel)]="creditComment">
        </div>
      </div>
    </div>
    <div class="AccrualBalanceFooter">
      <button class="AccrualBalanceSubmitButton" type="button" (click)="submitCredit()">Начислить</button>
    </div>
  </div>
</section>
