<section id="AddNewPhotoToGalleryModal" class="AddNewPhotoToGallerySection" [class.Active]="isOpen()">
  <div class="AddNewPhotoToGalleryOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="AddNewPhotoToGalleryCard">
    <div class="AddNewPhotoToGalleryHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <h2>Добавить фото</h2>
      <button type="button" class="AddNewPhotoToGalleryClose" (click)="closeFromOverlay($event)">&times;</button>
    </div>
    <div class="AddNewPhotoToGalleryContent">
      <div class="AddNewPhotoToGalleryDropZone" id="PhotoDropZone"
           [class.HasImage]="!!galleryPreview"
           [class.Dragover]="galleryDragover"
           (click)="onGalleryDropZoneClick($event)"
           (dragenter)="onGalleryDragOver($event)"
           (dragover)="onGalleryDragOver($event)"
           (dragleave)="onGalleryDragLeave($event)"
           (drop)="onGalleryDrop($event)">
        <span class="AddNewPhotoToGalleryDropZonePlusIcon">+</span>
        <span class="AddNewPhotoToGalleryDropZoneText">Добавить фото</span>
        <span class="AddNewPhotoToGalleryDropZoneHint">Нажмите, чтобы выбрать</span>
        <img class="AddNewPhotoToGalleryPreview" id="PhotoPreview" alt="Превью" [src]="galleryPreview || ''" />
        <button type="button" class="AddNewPhotoToGalleryReplaceBtn" id="PhotoReplaceBtn">Заменить</button>
      </div>
      <input type="file" id="PhotoFileInput" class="AddNewPhotoToGalleryFileInput" accept="image/*" (change)="onGalleryFileChange($event)" />
      <div class="AddNewPhotoToGalleryField">
        <label for="PhotoTag">Тег</label>
        <input type="text" id="PhotoTag" class="AddNewPhotoToGalleryInput" placeholder="Например: пляж, закат" maxlength="50" [(ngModel)]="galleryTag" />
      </div>
      <div class="AddNewPhotoToGalleryField">
        <label for="PhotoGroup">Группа</label>
        <input type="text" id="PhotoGroup" class="AddNewPhotoToGalleryInput" placeholder="Например: Лето 2025" maxlength="100" [(ngModel)]="galleryGroup" />
      </div>
    </div>
    <div class="AddNewPhotoToGalleryFooter">
      <button type="button" class="AddNewPhotoToGallerySubmitButton" id="PhotoSubmitBtn" [disabled]="!galleryFile || galleryUploading" (click)="submitGalleryPhoto()">Добавить</button>
    </div>
    <div id="PhotoUploadOverlay" class="PhotoUploadOverlay" [class.Active]="galleryUploading">
      <div class="PhotoUploadOverlayContent">
        <div class="PhotoUploadLoader">
