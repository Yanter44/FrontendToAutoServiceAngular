<section id="RedactPtoModal" class="RedactPtoModalSection" [class.Active]="isOpen()">
  <div class="RedactPtoModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="RedactPtoModalCard">
    <div class="RedactPtoModalHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <h2>Редактировать ПТО</h2>
    </div>
    <div class="RedactPtoModalContent">
      <div class="RedactPtoModalFieldsGroups">
        <div class="RedactPtoModalField">
          <label>что-то изменить</label>
          <input type="text" id="RedactPtoModalSOMETHINGInput" class="RedactPtoModalInput">
        </div>
      </div>
      <div class="RedactPtoModalFooter">
        <button class="BtnSubmitRedactPto" type="button" (click)="submitRedactPto()">Подтвердить</button>
      </div>
    </div>
  </div>
</section>
