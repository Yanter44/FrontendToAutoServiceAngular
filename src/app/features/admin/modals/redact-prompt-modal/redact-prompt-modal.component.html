<section id="RedactPromptModal" class="RedactPromptModalSection" [class.Active]="isOpen()">
  <div class="RedactPromptModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="RedactPromptModalCard">
    <div class="RedactPromptModalHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <h2>Изменить промпт</h2>
    </div>
    <div class="RedactPromptModalContent">
      <div class="RedactPromptModalFieldsGroup">
        <div class="RedactPromptModalField">
          <label>Тег</label>
          <input type="text" id="RedactPromptModalTagInput" class="RedactPromptModalInput" [(ngModel)]="redactPromptTag">
        </div>
        <div class="RedactPromptModalField">
          <label>Описание</label>
          <input type="text" id="RedactPromptModalDescriptionInput" class="RedactPromptModalInput" [(ngModel)]="redactPromptDescription">
        </div>
      </div>
      <div class="RedactPromptModalFooter">
        <button class="BtnSubmitRedactPrompt" type="button" (click)="submitRedactPrompt()">Подтвердить</button>
      </div>
    </div>
  </div>
</section>
