<section id="EditDocumentRequirementModal" class="EditDocumentRequirementModal" [class.Active]="isOpen()">
  <div class="EditDocumentRequirementModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="EditDocumentRequirementCard">
    <div class="EditDocumentRequirementHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <h2>Изменить требование к документу</h2>
    </div>
    <div class="EditDocumentRequirementContent">
      <div class="EditDocumentRequirementField">
        <label>Тип документа</label>
        <input type="text" id="EditDocumentRequirementTypeInput" class="EditDocumentRequirementInput" [(ngModel)]="editDocumentType">
      </div>
      <div class="EditDocumentRequirementField">
        <label>Отображаемое имя</label>
        <input type="text" id="EditDocumentRequirementDisplayNameInput" class="EditDocumentRequirementInput" [(ngModel)]="editDocumentDisplayName">
      </div>
      <div class="EditDocumentRequirementField">
        <label>Обязательное поле</label>
        <select id="EditDocumentRequirementIsRequireInput" class="EditDocumentRequirementSelect" [(ngModel)]="editDocumentIsRequire">
          <option value="true">Да</option>
          <option value="false">Нет</option>
        </select>
      </div>
    </div>
    <div class="EditDocumentRequirementFooter">
      <button class="EditDocumentRequirementSubmitButton" type="button" (click)="submitEditDocumentRequirement()">Сохранить</button>
    </div>
  </div>
</section>
