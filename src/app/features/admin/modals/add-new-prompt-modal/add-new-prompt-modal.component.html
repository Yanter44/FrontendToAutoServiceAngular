<section id="AddNewPromptModal" class="AddNewPromptSection" [class.Active]="isOpen()">
  <div class="AddNewPromptModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="AddNewPromptCard">
    <div class="AddNewPromptHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <h2>Добавить промпт</h2>
    </div>
    <div class="AddNewPromptContent">
      <div class="AddNewPromptField">
        <label>Тег</label>
        <input type="text" id="PromptTagInput" class="AddNewPromptInput" [(ngModel)]="promptTag">
      </div>
      <div class="AddNewPromptField">
        <label>Описание</label>
        <input type="text" id="PromptDescriptionInput" class="AddNewPromptInput" [(ngModel)]="promptDescription">
      </div>
    </div>
    <div class="AddNewPromptFooter">
      <button type="button" id="PromptSubmitBtn" class="AddNewPromptSubmitButton" (click)="submitNewPrompt()">Подтвердить</button>
    </div>
  </div>
</section>
