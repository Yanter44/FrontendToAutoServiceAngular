<section id="AddNewDocumentRequirementModal" class="AddNewDocumentRequirement" [class.Active]="isOpen()">
  <div class="AddNewDocumentRequirementOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="AddNewDocumentRequirementCard">
    <div class="AddNewDocumentRequirementHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1751ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <h2>Добавить тип документа</h2>
    </div>
    <div class="AddNewDocumentRequirementContent">
      <div class="AddNewDocumentRequirementField">
        <label>Тип документа</label>
        <input type="text" id="DocumentTypeRequirementInput" class="AddNewDocumentRequirementInput" [(ngModel)]="documentType">
      </div>
      <div class="AddNewDocumentRequirementField">
        <label>Отображаемое имя</label>
        <input type="text" id="DocumentDisplayNameRequirementInput" class="AddNewDocumentRequirementInput" [(ngModel)]="documentDisplayName">
      </div>
      <div class="AddNewDocumentRequirementField">
        <label>Обязательное поле</label>
        <select id="DocumentIsRequiredRequirementInput" class="AddNewDocumentRequirementSelect" [(ngModel)]="documentIsRequire">
          <option value="true">Да</option>
          <option value="false">Нет</option>
        </select>
      </div>
    </div>
    <div class="AddNewDocumentRequirementFooter">
      <button class="AddNewDocumentRequirementSubmitButton" type="button" (click)="submitNewDocumentRequirement()">Сохранить</button>
    </div>
  </div>
</section>
