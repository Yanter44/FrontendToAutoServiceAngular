<section id="DeletePhotoRequirementModal" class="DeletePhotoRequiremenModalSection" [class.Active]="isOpen()">
  <div class="DeletePhotoRequirementModalOverlay" (click)="closeFromOverlay($event)"></div>
  <div class="DeletePhotoRequirementModalCard">
    <div class="DeletePhotoRequirementModalHeader">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <h2>Удалить требование</h2>
    </div>
    <div class="DeletePhotoRequirementModalContent">
      <span class="DeletePhotoRequirementModalWarningContentSpan">Вы уверены, что хотите удалить требование "{{ selectedPhotoReqName() }}"?</span>
      <div class="DeletePhotoRequirementModalFooter">
        <button class="BtnSubmitDeletePhotoRequirement" type="button" (click)="submitDeletePhotoRequirement()">Удалить</button>
      </div>
    </div>
  </div>
</section>
