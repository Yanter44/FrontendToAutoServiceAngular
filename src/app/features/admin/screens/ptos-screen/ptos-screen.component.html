<div class="PtosScreen" id="PtosScreen" data-screen="ptos">
  <section class="TableSection">
    <div class="PtoHeaderSection">
      <div class="PtosSortSection">
        <div class="PtosSearchSort">
          <svg viewBox="-102.4 -102.4 1228.80 1228.80"><path d="M448 768A320 320 0 1 0 448 128a320 320 0 0 0 0 640z m297.344-76.992l214.592 214.592-54.336 54.336-214.592-214.592a384 384 0 1 1 54.336-54.336z" /></svg>
          <input id="PtosSearchSortInput" type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Поиск по № ПТО, названию, номеру RSA...">
        </div>
        <div class="PtosSortSelect">
          <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
            <option value="numberAsc">№ ПТО ↑</option>
            <option value="numberDesc">№ ПТО ↓</option>
          </select>
          <svg class="SelectArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
      <button class="BtnAddNewPto" type="button" (click)="add()">+ Добавить ПТО</button>
    </div>

    <table class="PtoTable">
      <thead>
        <tr>
          <th>№ ПТО</th>
          <th>Название ПТО</th>
          <th>Номер РСА</th>
          <th>Адрес</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="5"><app-screen-loading /></td></tr>
        } @else if (items().length === 0) {
          <tr><td colspan="5" style="text-align: center; color: #64748b;">Пункты ТО не найдены</td></tr>
        } @else {
          @for (pto of items(); track pto.id) {
            <tr class="PtoTableRow DetailsSidebarRow" [attr.data-pto-id]="pto.id" (click)="selectedPto(pto)">
              <td>{{ pto.id }}</td>
              <td style="font-weight: 500;">{{ pto.name }}</td>
              <td style="font-family: monospace;">{{ pto.rsaNumber }}</td>
              <td>{{ pto.address || '—' }}</td>
              <td>
                <div class="PtoActionsWrapper">
                  <button type="button" class="BtnRedactPto" (click)="$event.stopPropagation(); redact(pto)">
                    <img src="/assets/Images/redactt.png" class="BtnIcon" alt="Редактировать" />
                  </button>
                  <button type="button" class="BtnDeletePto" (click)="$event.stopPropagation(); remove(pto)">
                    <img src="/assets/Images/remove.png" class="BtnIcon" alt="Удалить" />
                  </button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
    <div class="PtosPagination">
      <app-pagination [currentPage]="result().page || page()" [totalItems]="result().totalCount" [pageSize]="pageSize" (pageChange)="load($event)" />
    </div>
  </section>
</div>
