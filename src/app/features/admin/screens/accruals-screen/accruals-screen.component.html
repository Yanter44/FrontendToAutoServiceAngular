<div class="AccrualsScreen" id="AccrualsScreen" data-screen="accruals">
  <section class="TableSection">
    <div class="AccrualHeaderSection">
      <div class="AccrualsSortSection">
        <div class="AccrualsSearchSort">
          <svg viewBox="-102.4 -102.4 1228.80 1228.80"><path d="M448 768A320 320 0 1 0 448 128a320 320 0 0 0 0 640z m297.344-76.992l214.592 214.592-54.336 54.336-214.592-214.592a384 384 0 1 1 54.336-54.336z" /></svg>
          <input id="AccrualsSearchSortInput" type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Поиск по № транзакции, агенту, комментарию...">
        </div>
        <div class="AccrualsSortSelect">
          <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
            <option value="newest">Сначала новые</option>
            <option value="oldest">Сначала старые</option>
          </select>
          <svg class="SelectArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
      <div class="AccrualHeaderButtons">
        <button class="BtnAccrualToBalance" type="button" (click)="credit()">+ Начислить баланс</button>
        <button class="BtnDeductFromBalance" type="button" (click)="debit()">- Вычесть баланс</button>
      </div>
    </div>

    <table class="AccrualsTable">
      <thead>
        <tr>
          <th>№ транзакции</th>
          <th>Агент</th>
          <th>Сумма</th>
          <th>Комментарий</th>
          <th>Дата</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="5"><app-screen-loading /></td></tr>
        } @else if (items().length === 0) {
          <tr><td colspan="5">Транзакции отсутствуют</td></tr>
        } @else {
          @for (tx of items(); track tx.externalId) {
            <tr class="AccrualsTableRow">
              <td>{{ tx.externalId }}</td>
              <td>{{ tx.agentName }}</td>
              <td [class]="amountClass(tx)">{{ amountText(tx) }}</td>
              <td>{{ tx.description ?? '-' }}</td>
              <td>{{ tx.createdAt | ruDate:true }}</td>
            </tr>
          }
        }
      </tbody>
    </table>
    <div class="TransactionsPagination">
      <app-pagination [currentPage]="result().page || page()" [totalItems]="result().totalCount" [pageSize]="pageSize" (pageChange)="load($event)" />
    </div>
  </section>
</div>
