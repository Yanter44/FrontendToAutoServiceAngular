<div class="NeuronNetworksScreen" id="NeuronNetworksScreen" data-screen="neuronNetworks">
  <section class="TableSection">
    <div class="NeuronNetworksHeaderSection">
      <div class="NeuronNetworksSortSection">
        <div class="NeuronNetworksSearchSort">
          <svg viewBox="-102.4 -102.4 1228.80 1228.80"><path d="M448 768A320 320 0 1 0 448 128a320 320 0 0 0 0 640z m297.344-76.992l214.592 214.592-54.336 54.336-214.592-214.592a384 384 0 1 1 54.336-54.336z" /></svg>
          <input id="NeuronNetworksSearchSortInput" type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Поиск по названию">
        </div>
        <div class="NeuronNetworksSortSelect">
          <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
            <option value="numberAsc">№ Нейросети ↑</option>
            <option value="numberDesc">№ Нейросети ↓</option>
          </select>
          <svg class="SelectArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
      <div class="NeuronNetworksHeaderButtons">
        <button class="BtnAddNeuronNetwork" type="button" (click)="add()">+ Добавить</button>
      </div>
    </div>
    <table class="NeuronNetworksTable">
      <thead>
        <tr>
          <th>№ Нейросети</th>
          <th>Название</th>
          <th>Ссылка</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="4"><app-screen-loading /></td></tr>
        } @else if (items().length === 0) {
          <tr><td colspan="4" style="text-align: center; color: #64748b;">Нейронки не найдены</td></tr>
        } @else {
          @for (item of items(); track item.id) {
            <tr class="NeuronNetworksTableRow" [attr.data-neuronNetwork-id]="item.id">
              <td>{{ item.id }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.link }}</td>
              <td>
                <div class="NeuronNetworkActionsWrapper">
                  <button type="button" class="BtnRedactNeuronNetwork" (click)="redact(item)">
                    <img src="/assets/Images/redactt.png" class="BtnIcon" alt="Редактировать" />
                  </button>
                  <button type="button" class="BtnDeleteNeuronNetwork" (click)="remove(item)">
                    <img src="/assets/Images/remove.png" class="BtnIcon" alt="Удалить" />
                  </button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
    <div class="NeuronNetworksPagination">
      <app-pagination [currentPage]="result().page || page()" [totalItems]="result().totalCount" [pageSize]="pageSize" (pageChange)="load($event)" />
    </div>
  </section>
</div>
