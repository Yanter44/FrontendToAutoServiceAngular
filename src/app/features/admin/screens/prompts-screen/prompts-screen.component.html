<div class="LibraryOfPromptsScreen" id="LibraryOfPromptsScreen" data-screen="prompts">
  <section class="TableSection">
    <div class="PromptHeaderSection">
      <div class="PromptsSortSection">
        <div class="PromptsSearchSort">
          <svg viewBox="-102.4 -102.4 1228.80 1228.80"><path d="M448 768A320 320 0 1 0 448 128a320 320 0 0 0 0 640z m297.344-76.992l214.592 214.592-54.336 54.336-214.592-214.592a384 384 0 1 1 54.336-54.336z" /></svg>
          <input id="PromptsSearchSortInput" type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Поиск по № промпта, тегу, описанию...">
        </div>
        <div class="PromptsSortSelect">
          <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
            <option value="numberAsc">№ Промпта ↑</option>
            <option value="numberDesc">№ Промпта ↓</option>
          </select>
          <svg class="SelectArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
      <button class="BtnAddNewPrompt" type="button" (click)="add()">+ Новый промпт</button>
    </div>

    <table class="PromptTable">
      <thead>
        <tr>
          <th>№ промпта</th>
          <th>Тег</th>
          <th>Описание</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="4"><app-screen-loading /></td></tr>
        } @else if (items().length === 0) {
          <tr><td colspan="4" style="text-align: center; color: #64748b;">Промпты не найдены</td></tr>
        } @else {
          @for (prompt of items(); track prompt.promptId) {
            <tr class="PromptTableRow" [attr.data-prompt-id]="prompt.promptId">
              <td>{{ prompt.promptId }}</td>
              <td><span class="PromptTagBadge">#{{ prompt.tag }}</span></td>
              <td>{{ prompt.description }}</td>
              <td>
                <div class="PromptActionsWrapper">
                  <button type="button" class="BtnRedactPrompt" (click)="redact(prompt)">
                    <img src="/assets/Images/redactt.png" class="BtnIcon" alt="Редактировать" />
                  </button>
                  <button type="button" class="BtnDeletePrompt" (click)="remove(prompt)">
                    <img src="/assets/Images/remove.png" class="BtnIcon" alt="Удалить" />
                  </button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
    <div class="PromptsPagination">
      <app-pagination [currentPage]="result().page || page()" [totalItems]="result().totalCount" [pageSize]="pageSize" (pageChange)="load($event)" />
    </div>
  </section>
</div>
